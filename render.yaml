# Render.com Blueprint Specification for REXJAR Backend API
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: rexjar-backend-api
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install && npm run build:packages && npm run build --workspace=@rexjar/backend-api
    startCommand: npm run start --workspace=@rexjar/backend-api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # Pega aquí la cadena de conexión provista por Neon.tech
